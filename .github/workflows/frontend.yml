name: eslint|vue-tsc|build

on:
  - workflow_dispatch

jobs:
  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Run eslint
        run: npm run lint

      - name: Run vue-tsc
        run: npm run type-check

      - name: Build assets
        run: npm run build
