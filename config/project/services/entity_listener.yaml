services:
  _defaults:
    public: true
    autowire: true

  app.entity_listener.media:
    class: App\Domain\Media\EventListener\Entity\MediaUploadListener
    tags:
      - name: doctrine.event_listener
        event: prePersist
        entity: App\Entity\Media
        method: prePersist

      - name: doctrine.event_listener
        event: preUpdate
        entity: App\Entity\Media
        method: preUpdate

      - name: doctrine.event_listener
        event: preRemove
        entity: App\Entity\Media
        method: preRemove

  app.entity_listener.system_event_recipient:
    class: App\Domain\SystemEventRecipient\EventListener\Entity\SystemEventRecipientListener
    tags:
      - name: doctrine.event_listener
        event: postPersist
        entity: App\Entity\SystemEventRecipient
        method: postPersist

  app.entity_listener.elastica_cascade_remove:
    class: App\Domain\Work\EventListener\Entity\ElasticaCascadeRemoveListener
    tags:
      - name: doctrine.event_listener
        event: preRemove
        method: preRemove

      - name: doctrine.event_listener
        event: postFlush
        method: postFlush

      - name: kernel.reset
        method: reset

  app.entity_listener.elastica_conversation_reindex:
    class: App\Domain\Conversation\EventListener\Entity\ElasticaConversationReindexListener
    tags:
      - name: doctrine.event_listener
        event: preUpdate
        method: preUpdate

      - name: doctrine.event_listener
        event: postPersist
        method: postPersist

      - name: doctrine.event_listener
        event: postFlush
        method: postFlush

      - name: kernel.reset
        method: reset
