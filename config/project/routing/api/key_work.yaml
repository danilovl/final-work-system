api_key_get_work_list:
  path: /{type}
  requirements:
    type: 'author|opponent|consultant|supervisor'
  defaults:
    _controller: App\Domain\Work\Controller\Api\WorkController::list
  methods: [GET]

api_key_get_work_detail:
  path: /{id}/detail
  requirements:
    id: '\d+'
  defaults:
    _controller: App\Domain\Work\Controller\Api\WorkController::detail
  methods: [GET]

api_key_post_work_create:
  path: /create
  defaults:
    _controller: App\Domain\Work\Controller\Api\WorkController::create
  methods: [POST]
