fos_elastica:
  clients:
    default:
      hosts: ['%env(ELASTICSEARCH_URL)%']
      username: '%env(ELASTICSEARCH_USERNAME)%'
      password: '%env(ELASTICSEARCH_PASSWORD)%'

  indexes:
    work:
      client: default
      index_name: '%env(ELASTICSEARCH_INDEX_PREFIX)%work_index'
      settings: &index_settings
        index:
          number_of_shards: 1
          number_of_replicas: '%env(int:ELASTICSEARCH_NUMBER_OF_REPLICAS)%'
          analysis:
            char_filter:
              punctuation_to_space:
                type: pattern_replace
                pattern: '[^\p{L}\p{Nd}]+'
                replacement: ' '
            normalizer:
              search_normalizer:
                type: custom
                char_filter:
                  - punctuation_to_space
                filter:
                  - lowercase
                  - asciifolding
                  - trim
            analyzer:
              folding_analyzer:
                type: custom
                tokenizer: standard
                filter:
                  - lowercase
                  - asciifolding
              html_shingle_analyzer:
                type: custom
                char_filter:
                  - html_strip
                tokenizer: standard
                filter:
                  - lowercase
                  - asciifolding
                  - shingle_filter
              html_normalized_analyzer:
                type: custom
                char_filter:
                  - html_strip
                tokenizer: keyword
                filter:
                  - lowercase
                  - asciifolding
            filter:
              shingle_filter:
                type: shingle
                min_shingle_size: 2
                max_shingle_size: 4
                output_unigrams: true

      properties:
        id:
          type: integer
        title: &search_text
          type: text
          analyzer: folding_analyzer
          fields:
            normalized:
              type: keyword
              normalizer: search_normalizer
              ignore_above: 1024
        shortcut: *search_text
        deadline:
          type: date
        deadlineProgram:
          type: date
        type: &object_id
          type: object
          properties:
            id:
              type: integer
        status: *object_id
        author: *object_id
        supervisor: *object_id
        opponent: *object_id
        consultant: *object_id
        created_at:
          type: date
        updated_at:
          type: date
      persistence:
        driver: orm
        model: App\Domain\Work\Entity\Work
        finder: ~
        provider: ~
        listener: ~
        elastica_to_model_transformer:
          query_builder_method: createSearchQueryBuilder

    conversation:
      client: default
      index_name: '%env(ELASTICSEARCH_INDEX_PREFIX)%conversation_index'
      settings: *index_settings
      properties:
        id:
          type: integer
        name: *search_text
        work:
          type: object
          properties:
            id:
              type: integer
            title: *search_text
        participants:
          type: object
          properties:
            id:
              type: integer
            user: *object_id
        created_at:
          type: date
        updated_at:
          type: date
      persistence:
        driver: orm
        model: App\Domain\Conversation\Entity\Conversation
        finder: ~
        provider: ~
        listener: true

    conversation_message:
      client: default
      index_name: '%env(ELASTICSEARCH_INDEX_PREFIX)%conversation_message_index'
      settings: *index_settings
      properties:
        id:
          type: integer
        content:
          type: text
          analyzer: html_shingle_analyzer
          fields:
            normalized:
              type: text
              analyzer: html_normalized_analyzer
        created_at:
          type: date
        updated_at:
          type: date
        conversation:
          type: object
          properties:
            id:
              type: integer
            participants:
              type: object
              properties:
                id:
                  type: integer
                user: *object_id
      persistence:
        driver: orm
        model: App\Domain\ConversationMessage\Entity\ConversationMessage
        finder: ~
        provider: ~
        listener: true

    task:
      client: default
      index_name: '%env(ELASTICSEARCH_INDEX_PREFIX)%task_index'
      settings: *index_settings
      properties:
        id:
          type: integer
        name: *search_text
        description:
          type: text
          analyzer: html_shingle_analyzer
        owner: *object_id
        created_at:
          type: date
        updated_at:
          type: date
      persistence:
        driver: orm
        model: App\Domain\Task\Entity\Task
        finder: ~
        provider: ~
        listener: true
